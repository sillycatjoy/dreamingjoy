<!DOCTYPE html>
<html>
<head>
  
  <title>JOY CLICKER II</title>
  <link href="/images/milly-cat.png" rel="icon">
  <link href="/joyclicker2/styles/dark.css" rel="stylesheet" id="themeStylesheet">
  
  <style>
    
    body {
      overflow-x: hidden;
      overflow-y: hidden;
    }

    p {
      margin-top: 0px;
      margin-bottom: 0px;
    }
    
    .game {
      width: 70vw;
      height: 85vh;
      background-color: rgba(0, 0, 0, 0.75);
      border: 0.2rem solid white;
      border-radius: 2.5rem;
      display: flex;
      align-items: center;
      padding: 1rem;
    }
    
    .buttonsection {
      width: 45vw;
      height: 80vh;
      background-color: rgba(0, 0, 0, 0);
      overflow: hidden;
      text-align: center;
    }
    
    .shopsection {
      width: 23vw;
      height: 80vh;
      background-color: rgba(0, 0, 0, 0);
      border: 0.2rem solid white;
      border-radius: 2.5rem;
      overflow-x: hidden;
      overflow-y: scroll;
      display: flex;
      align-items: center;
      flex-direction: column;
    }
    
  </style>
  
</head>

<body>
  
  <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    
    <div class=game>
      
      <div class=buttonsection>
        
        <h1 style="font-size: 4vmax;">JOY CLICKER II</h1>
        <img src="/joyclicker/images/buttons/button.png" width=215vw height=215vw id=button onclick="giveMoney()" style="margin-bottom: 1rem;">
        <p>CURRENT BALANCE: $<span id=money>0</span></p>
        <p>LEVEL: <span id=level>1</span> || <span id=xp>0</span> / <span id=nextlevelxp>75</span></p>
        <p>[<span id=progressbar>--------------------------------</span>]</p>
        
      </div>
      
      <div class=shopsection>
        
        <h1 style="font-size: 4vmax;">SHOP</h1>
        <a onclick="buyMpc()">CURSOR UPGRADE - $<span id=mpcDisplay>25</span></a>
        <a onclick="buyMps()">AUTOCLICKER - $<span id=mpsDisplay>75</span></a>
        
        <br>
        
        <details id=level2shop style="display: none; margin-top: 8px">
          <summary><b>Level 2</b></summary>
          <p>All themes cost $20.</p>
          <p><a onclick="setTheme('dark')">Dark (Default)</a>, <a onclick="setTheme('bluestar')">Bluestar</a></p>
        </details>
        
        <br>s
        
        <details id=level3shop style="display: none; margin-top: 8px">
          <summary><b>Level 3</b></summary>
          <p>You can sacrifice 25 Cursor Uprades and 10 Autoclickers to summon a dead god.</p>
          <p><a onclick="summonGod()">Sacrifice</a></p>
        </details>
        
      </div>
      
    </div>
    
  </div>

  <script>

    let money = 0;

    let level = 1;
    let xp = 0;

    let mpc = 1;
    var mps = 0;

    let mpcCost = 25;
    let mpsCost = 75;
    
    let themes = ["dark"]

    function giveMoney() {
      money += mpc;
      addXP()
      document.getElementById("money").innerHTML = money;
      
      document.title = 'JOY CLICKER II - $'+money;
      document.getElementById("button").src = "/joyclicker/images/buttons/buttonhover.png";

      setTimeout(function() {
        document.getElementById("button").src = "/joyclicker/images/buttons/button.png";
      }, 125)
    }

    function buyMpc() {
      if (money >= mpcCost) {
        money = money-mpcCost;

        mpc += 1;
        mpcCost = 25+(15*mpc);
        document.getElementById("money").innerHTML = money;
        document.getElementById("mpcDisplay").innerHTML = mpcCost;
      }
    }

    function buyMps() {
      if (money >= mpsCost) {
        money = money-mpsCost;

        mps += 1;
        mpsCost = 75+(85*mps);
        document.getElementById("money").innerHTML = money;
        document.getElementById("mpsDisplay").innerHTML = mpsCost;
      }
    }
    
    function progressBar() {
      let progress = '';
      
      for (let i = 0; i < 32; i += 1) {
        if (((xp / (75+50*level))*100)/3.2 > i) {
          progress = progress + "|";
        } else {
          progress = progress + "-";
        }
      }
      
      document.getElementById("progressbar").innerHTML = progress
    }

    function addXP() {
      xp += 1;
      
      if (xp >= 75+50*level) {
        xp = 0;
        level += 1;
        
        if (level == 2) {
          document.getElementById("level2shop").style.display = "block";
        }
        
        if (level == 3) {
          document.getElementById("level3shop").style.display = "block";
        }
      }
        
      document.getElementById("level").innerHTML = level;
      document.getElementById("xp").innerHTML = xp;
      document.getElementById("nextlevelxp").innerHTML = 75+50*level;

      progressBar();

    }

    function setTheme(themeInput) {
      if (themes.includes(themeInput)) {
        document.getElementById("themeStylesheet").setAttribute("href", "/joyclicker2/styles/"+themeInput+".css");
      } else if (money >= 20) {
        money -= 20;
        themes.push(themeInput);
        document.getElementById("themeStylesheet").setAttribute("href", "/joyclicker2/styles/"+themeInput+".css");
      }
    }
    
    setInterval(function() {
      money = money+mps;
      document.getElementById("money").innerHTML = money;
      document.title = 'JOY CLICKER II - $'+money;
    }, 1000)
    
  </script>
  
</body>
</html>
