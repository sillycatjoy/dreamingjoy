<!DOCTYPE html>
<html>
<head>
  
  <title>JOY CLICKER II</title>
  <link href="/images/milly-cat.png" rel="icon">
  <link href="/joyclicker2/styles/dark.css" rel="stylesheet" id="themeStylesheet">
  
  <style>
    
    body {
      overflow-x: hidden;
      overflow-y: hidden;
    }

    p {
      margin-top: 0px;
      margin-bottom: 0px;
    }
    
    .game {
      width: 70vw;
      height: 85vh;
      background-color: rgba(0, 0, 0, 0.75);
      border: 0.2rem solid white;
      border-radius: 2.5rem;
      display: flex;
      align-items: center;
      padding: 1rem;
    }
    
    .buttonsection {
      width: 45vw;
      height: 80vh;
      background-color: rgba(0, 0, 0, 0);
      overflow: hidden;
      text-align: center;
    }
    
    .shopsection {
      width: 23vw;
      height: 80vh;
      background-color: rgba(0, 0, 0, 0);
      border: 0.2rem solid white;
      border-radius: 2.5rem;
      overflow-x: hidden;
      overflow-y: scroll;
      display: flex;
      align-items: center;
      flex-direction: column;
    }
    
  </style>
  
</head>

<body>
  
  <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;">
    
    <div class=game>
      
      <div class=buttonsection>
        
        <h1 style="font-size: 4vmax;">JOY CLICKER II</h1>
        <img src="/joyclicker/images/buttons/button.png" width=215vw height=215vw id=button onclick="giveMoney()" style="margin-bottom: 1rem;">
        <p>CURRENT BALANCE: $<span id=money>0</span></p>
        <p>LEVEL: <span id=level>1</span> || <span id=xp>0</span> / <span id=nextlevelxp>125</span></p>
        <p>[<span id=progressbar>--------------------------------</span>]</p>
        
      </div>
      
      <div class=shopsection>
        
        <h1 style="font-size: 4vmax;">SHOP</h1>
        <a onclick="buyMpc()">CURSOR UPGRADE - $<span id=mpcDisplay>25</span></a>
        <a onclick="buyMps()">AUTOCLICKER - $<span id=mpsDisplay>75</span></a>
        <p id=savemenu><a onclick="saveData()">Save</a> // <a onclick="loadData()">Load</a></p>
        
        <br>
        
        <details id=level2shop style="display: none; margin-top: 8px">
          <summary><b>Level 2</b></summary>
          <p>All themes cost $20.</p>
          <p><a onclick="setTheme('dark')">Dark (Default)</a>, <a onclick="setTheme('bluestar')">Bluestar</a></p>
        </details>
        
        <br>
        
        <details id=level3shop style="display: none; margin-top: 8px">
          <summary><b>Level 3</b></summary>
          <p>" <span id=friendDialogue>Hello there</span> "</p>
          <img src="/joyclicker2/images/friend.jpg" width=96vw height=96vw>
          <br>
          <a onclick="friendQuestion(1)">Who are you?</a>
          <br>
          <a onclick="friendQuestion(2)">Tell me my statistics please</a>
          <br>
          <a onclick="friendQuestion(3)">How are you?</a>
        </details>
        
      </div>
      
    </div>
    
  </div>

  <script>

    let money = 0;
    let totalClicks = 0;

    let level = 1;
    let xp = 0;

    let mpc = 1;
    var mps = 0;

    let mpcCost = 25;
    let mpsCost = 75;
    
    let themes = ["dark"]

    if (typeof(Storage) !== "undefined") {
      document.getElementById("savemenu").style.display = "block";
    } else {
      document.getElementById("savemenu").style.display = "none";
    }

    function updateVisuals() {
      document.getElementById("money").innerHTML = money;
      document.getElementById("mpcDisplay").innerHTML = mpcCost;
      document.getElementById("mpsDisplay").innerHTML = mpsCost;
      
      document.getElementById("level").innerHTML = level;
      document.getElementById("xp").innerHTML = xp;
      document.getElementById("nextlevelxp").innerHTML = 75+50*level;
      
      if (level >= 2) {
        document.getElementById("level2shop").style.display = "block";
      }
        
      if (level >= 3) {
        document.getElementById("level3shop").style.display = "block";
      }

      // progress bar v
      
      let progress = '';
      
      for (let i = 0; i < 32; i += 1) {
        if (((xp / (75+50*level))*100)/3.2 > i) {
          progress = progress + "|";
        } else {
          progress = progress + "-";
        }
      }
      
      document.getElementById("progressbar").innerHTML = progress;
    }
    
    function giveMoney() {
      money += mpc;
      totalClicks++;
      addXP(1);
      
      document.title = 'JOY CLICKER II - $'+money;
      document.getElementById("button").src = "/joyclicker/images/buttons/buttonhover.png";

      setTimeout(function() {
        document.getElementById("button").src = "/joyclicker/images/buttons/button.png";
      }, 125)
    }
    
    function buyMpc() {
      if (money >= mpcCost) {
        money = money-mpcCost;

        mpc += 1;
        mpcCost = 25+(15*mpc);
        updateVisuals()
      }
    }

    function buyMps() {
      if (money >= mpsCost) {
        money = money-mpsCost;

        mps += 1;
        mpsCost = 75+(85*mps);
        updateVisuals()
      }
    }

    function addXP(number) {
      xp += number;
      
      if (xp >= 75+50*level) {
        xp = 0;
        level += 1;
        
        
      }

      updateVisuals();
    }

    function friendQuestion(question) {
      let dialogue = document.getElementById("friendDialogue");

      if (question == 1) {
        dialogue.innerHTML = "I am Ransom. I am a cat. I am a friend.";
      } else if (question == 2) {
        dialogue.innerHTML = ("You have clicked the kitty " + totalClicks + " times. You gain $" + mpc + " per click and $" + mps + " every second.");
      } else if (question == 3) {
        dialogue.innerHTML = ("I'm skilletastic.");
      }
    }

    function setTheme(themeInput) {
      if (themes.includes(themeInput)) {
        document.getElementById("themeStylesheet").setAttribute("href", "/joyclicker2/styles/"+themeInput+".css");
      } else if (money >= 20) {
        money -= 20;
        themes.push(themeInput);
        document.getElementById("themeStylesheet").setAttribute("href", "/joyclicker2/styles/"+themeInput+".css");
      }
    }
    
    setInterval(function() {
      money = money+mps;
      document.getElementById("money").innerHTML = money;
      document.title = 'JOY CLICKER II - $'+money;
    }, 1000)
    
    function saveData() {
      localStorage.setItem("moneyData", money);
      localStorage.setItem("mpcData", mpc);
      localStorage.setItem("mpsData", mps);
      localStorage.setItem("xpData", xp);
      localStorage.setItem("levelData", level);
    }
    
    function loadData() {
      money = Number(localStorage.getItem("moneyData"));
      mpc = Number(localStorage.getItem("mpcData"));
      mps = Number(localStorage.getItem("mpsData"));
      xp = Number(localStorage.getItem("xpData"));
      level = Number(localStorage.getItem("levelData"));
      updateVisuals();
    }
    
  </script>
  
</body>
</html>
