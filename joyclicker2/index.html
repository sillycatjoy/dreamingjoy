<html>

  <head>
    
    <title>JOY CLICKER II</title>
    <link href="/images/milly-cat.png" rel="icon">
    <link href="/joyclicker2/styles/dark.css" rel="stylesheet">
    
    <style>
      
      body {
        overflow-x: hidden;
        overflow-y: hidden;
      }
      
      .game {
        width: 70rem;
        height: 45rem;
        background-color: rgba(0, 0, 0, 0.75);
        border: 0.2rem solid white;
        border-radius: 2.5rem;
        display: flex;
        align-items: center;
        padding: 1rem;
      }
      
      .buttonsection {
        width: 45rem;
        height: 43.5rem;
        background-color: rgba(0, 0, 0, 0);
        overflow: hidden;
        text-align: center;
      }
      
      .shopsection {
        width: 23rem;
        height: 43.5rem;
        background-color: rgba(0, 0, 0, 0);
        border: 0.2rem solid white;
        border-radius: 2.5rem;
        overflow-x: hidden;
        overflow-y: scroll;
        display: flex;
        align-items: center;
        flex-direction: column;
      }
      
    </style>
    
  </head>

  <body>
    
    <div style="width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden;">
      
      <div class=game>
        
        <div class=buttonsection>
          
          <h1 style="font-size: 4rem;">JOY CLICKER II</h1>
          <img src="/joyclicker/images/buttons/button.png" width=200px height=200px id=button onclick="giveMoney()" style="margin-bottom: 1rem;">
          <p>CURRENT BALANCE: $<span id=money>0</span></p>
          
        </div>
        
        <div class=shopsection>
          
          <h1 style="font-size: 4rem;">SHOP</h1>
          
        </div>
        
      </div>
      
    </div>

    <script>

      var money=0;

      var mpc=1;
      var mps=0;

      function giveMoney() {
        money = money+mpc
        document.getElementById("money").innerHTML = money;
        
        document.title = 'JOY CLICKER - $'+money;
        document.getElementById("button").src = "/joyclicker/images/buttons/buttonhover.png"

        setTimeout(function() {
          document.getElementById("button").src = "/joyclicker/images/buttons/button.png"
        }, 200)
      }
      
    </script>
    
  </body>

</html>
